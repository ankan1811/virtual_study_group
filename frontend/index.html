<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Virtual Study Group</title>
	</head>
	<body>
		<script>
			(function(){var t=localStorage.getItem('theme');if(t==='dark'||(!t&&window.matchMedia('(prefers-color-scheme:dark)').matches)){document.documentElement.classList.add('dark')}})();
		</script>
		<div id="root">
			<!-- Inline shell: visible instantly before React mounts, replaced automatically by createRoot().render() -->
			<div style="position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 20% 50%,#1e1040 0%,transparent 60%),radial-gradient(ellipse at 80% 20%,#0f1f4d 0%,transparent 60%),linear-gradient(135deg,#0a0718 0%,#0f1628 50%,#0a0f28 100%)">
				<div style="text-align:center">
					<h1 style="margin:0 0 12px;font-size:1.75rem;font-weight:700;font-family:'Poppins',system-ui,sans-serif;background:linear-gradient(135deg,#a5b4fc,#fff 55%,#67e8f9);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text">Virtual Study Group</h1>
					<p style="margin:0 0 16px;font-size:0.875rem;color:#a5b4fc;font-family:'Poppins',system-ui,sans-serif;opacity:0.8">Waking up the study rooms</p>
					<div style="display:flex;gap:6px;justify-content:center">
						<span style="width:6px;height:6px;border-radius:50%;background:#a5b4fc;animation:_dp 1.2s infinite ease-in-out both"></span>
						<span style="width:6px;height:6px;border-radius:50%;background:#a5b4fc;animation:_dp 1.2s .2s infinite ease-in-out both"></span>
						<span style="width:6px;height:6px;border-radius:50%;background:#a5b4fc;animation:_dp 1.2s .4s infinite ease-in-out both"></span>
					</div>
				</div>
				<style>@keyframes _dp{0%,80%,100%{opacity:0;transform:scale(.7)}40%{opacity:1;transform:scale(1)}}</style>
			</div>
		</div>
		<script defer src="https://cdn.jsdelivr.net/npm/p5@1.9.2/lib/p5.js"></script>
		<script defer src="https://cdn.jsdelivr.net/npm/p5@1.9.2/lib/addons/p5.sound.js"></script>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
